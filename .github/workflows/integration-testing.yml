name: BQ Testing

on:
  pull_request:
    branches: [ main ]

jobs:
  test-bigquery-magics:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout local PR of spanner-graph-notebook
      - name: Checkout spanner-graph-notebook (Repo A)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 2: Checkout bigquery-magics.
      # googleapis/python-bigquery-magics is archived (frozen at 0.12.1); the
      # package now lives in the google-cloud-python monorepo. Sparse-checkout
      # only the bigquery-magics package to keep the clone small.
      - name: Checkout bigquery-magics (Repo B)
        uses: actions/checkout@v4
        with:
          repository: googleapis/google-cloud-python
          path: google-cloud-python
          sparse-checkout: packages/bigquery-magics
          sparse-checkout-cone-mode: true

      - name: Install and test
        run: |
          set -e
          BQM=google-cloud-python/packages/bigquery-magics
          python -m venv venv
          . venv/bin/activate
          
          # Steps 3, 4, 5: Install test dependencies (pytest, etc.)
          # We also include portpicker, which was in your original file and is
          # likely required by the tests.
          pip install pytest google-cloud-testutils google-cloud-bigquery-storage portpicker
          
          # Step 1 (continued): Install spanner-graph-notebook in editable mode
          # The '.' refers to the root directory, where Repo A was checked out.
          pip install -e .
          
          # Step 2 (continued): Install bigquery-magics in editable mode
          # This installs from the monorepo's 'packages/bigquery-magics' subdirectory.
          # pip will see that spanner-graph-notebook is already installed.
          pip install -e ./$BQM
          
          # Prepend the required import to the test files
          echo "import spanner_graphs.graph_visualization as graph_visualization" | cat - $BQM/tests/unit/test_graph_server.py > temp && mv temp $BQM/tests/unit/test_graph_server.py
          echo "import spanner_graphs.graph_visualization as graph_visualization" | cat - $BQM/tests/unit/bigquery/test_bigquery.py > temp && mv temp $BQM/tests/unit/bigquery/test_bigquery.py
          
          # Step 6: Run the tests
          pytest -v $BQM/tests/unit/test_graph_server.py $BQM/tests/unit/bigquery/test_bigquery.py
